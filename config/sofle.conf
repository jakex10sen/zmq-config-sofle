# Uncomment the following line to enable the Sofle OLED Display
CONFIG_ZMK_DISPLAY=y

# Uncomment these two lines to add support for encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Azoteq TPS43 trackpad on the right half (see sofle_right.overlay)
CONFIG_ZMK_POINTING=y

# The trackpad driver's input handling needs more stack than the default.
# Both halves get it, since the central side processes the split events too.
CONFIG_INPUT_THREAD_STACK_SIZE=2048
