manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: essenceotd
      url-base: https://github.com/essenceotd
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    # Azoteq IQS5xx (TPS43/TPS65) trackpad driver. Pinned to a known commit
    # so an upstream change can't silently break the build.
    - name: zmk_driver_azoteq
      remote: essenceotd
      revision: af570230ceb629f7b49c643e67b3e91ef4503d19
  self:
    path: config
